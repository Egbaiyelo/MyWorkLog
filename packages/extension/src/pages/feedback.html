<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feedback & Feature Requests</title>
    <link rel="stylesheet" href="feedback.css">
</head>
<body>

    <div class="feedback-container">

        <header class="feedback-header">
            <div>
                <div class="avatar-wave">👋</div>
                <h1>Hey there!</h1>
            </div> 
            <p class="personal-note">
                I use this extension too. 
                I want to make it as awesome as possible, and I'd love to hear your thoughts.
            </p>
        </header>

        <hr class="divider">

        <!-- Feature Request Form -->
        <section class="form-section">
            <h2>Have a feature request?</h2>
            <p class="subtitle">Let me know what you'd like to see added:</p>
            
            <form action="#" method="POST" class="feedback-form">
                <div class="form-group">
                    <label for="email">Your Email (optional)</label>
                    <input type="email" id="email" name="email" placeholder="So I can update you!">
                </div>

                <div class="form-group">
                    <label for="suggestion">What's your brilliant idea?</label>
                    <textarea id="suggestion" name="suggestion" rows="4" required placeholder="I wish this extension could..."></textarea>
                </div>

                <button type="submit" class="submit-btn">Send Feature Request</button>
            </form>
        </section>

        <!-- GitHub Section -->
        <footer class="github-section">
            <p>Spot a bug or want to contribute to the code directly?</p>
            <!-- Replace the '#' with your actual GitHub repository URL -->
            <a href="https://github.com/Egbaiyelo/MyWorkLog/issues" target="_blank" class="github-btn">
                <svg class="github-icon" viewBox="0 0 16 16" width="20" height="20" aria-hidden="true"><path d="M8 0c4.42 0 8 3.58 8 8 0 3.54-2.29 6.53-5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0016 8c0-4.42-3.58-8-8-8z"></path></svg>
                Open an Issue on GitHub
            </a>
        </footer>
    </div>

</body>
</html>
